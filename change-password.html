<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVERYX | Change Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #070709;
            --panel: #101014;
            --border: #292930;
            --border-soft: #202026;
            --text: #f5f5f7;
            --muted: #898992;
            --soft: #606069;
            --red: #e52249;
            --green: #42c998;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 82% 0%,
                    rgba(126, 20, 52, .18),
                    transparent 31%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .app {
            width: 100%;
            max-width: 850px;

            margin: auto;

            padding:
                18px 18px 115px;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 11px;
        }

        .brand img {
            width: 42px;
            height: 42px;

            object-fit: contain;
        }

        .brand-name {
            font-family: Georgia, serif;

            font-size: 22px;

            letter-spacing: 3px;
        }

        .back {
            color: var(--muted);

            font-size: 13px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            padding:
                31px 2px 25px;
        }

        .eyebrow {
            color: var(--muted);

            font-size: 10px;

            letter-spacing: 2.5px;

            text-transform: uppercase;
        }

        .header h1 {
            margin-top: 8px;

            font-family: Georgia, serif;

            font-size:
                clamp(35px, 8vw, 50px);
        }

        .header p {
            max-width: 620px;

            margin-top: 9px;

            color: var(--muted);

            font-size: 12px;

            line-height: 1.7;
        }

        /* =========================
           PASSWORD CARD
        ========================= */

        .password-card {
            padding: 20px;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background: var(--panel);
        }

        .field {
            margin-bottom: 18px;
        }

        .field:last-of-type {
            margin-bottom: 0;
        }

        .field-label {
            display: block;

            margin-bottom: 7px;

            color: var(--soft);

            font-size: 8px;

            letter-spacing: .9px;

            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
        }

        .input {
            width: 100%;

            height: 46px;

            padding:
                0 45px 0 13px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            outline: none;

            background: #0b0b0f;

            color: var(--text);

            font-size: 10px;

            transition:
                border-color .2s ease,
                background .2s ease;
        }

        .input::placeholder {
            color: #55555e;
        }

        .input:focus {
            border-color:
                rgba(229, 34, 73, .45);

            background: #0d0d12;
        }

        .toggle-password {
            position: absolute;

            right: 13px;
            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color: var(--soft);

            cursor: pointer;

            font-size: 12px;
        }

        .toggle-password:hover {
            color: white;
        }

        /* =========================
           FORGOT PASSWORD
        ========================= */

        .forgot-row {
            margin-top: 14px;

            display: flex;

            justify-content: flex-end;
        }

        .forgot-link {
            color: #ed5875;

            font-size: 9px;

            transition:
                opacity .2s ease;
        }

        .forgot-link:hover {
            opacity: .75;
        }

        /* =========================
           SAVE BUTTON
        ========================= */

        .save-button {
            width: 100%;

            height: 46px;

            margin-top: 21px;

            border:
                1px solid
                rgba(229, 34, 73, .4);

            border-radius: 10px;

            background:
                rgba(229, 34, 73, .12);

            color: #ed5875;

            cursor: pointer;

            font-size: 9px;

            letter-spacing: .5px;

            text-transform: uppercase;

            transition:
                background .2s ease;
        }

        .save-button:hover {
            background:
                rgba(229, 34, 73, .19);
        }

        /* =========================
           SECURITY NOTE
        ========================= */

        .security-note {
            margin-top: 13px;

            padding: 13px;

            border:
                1px solid var(--border-soft);

            border-radius: 10px;

            background: var(--panel);

            color: var(--soft);

            font-size: 8px;

            line-height: 1.7;

            text-align: center;
        }

        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-nav {
            position: fixed;

            left: 50%;
            bottom: 14px;

            transform:
                translateX(-50%);

            width:
                calc(100% - 28px);

            max-width: 700px;

            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 4px;

            padding: 7px;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background:
                rgba(11, 11, 15, .94);

            backdrop-filter:
                blur(16px);

            z-index: 20;
        }

        .nav-item {
            min-height: 49px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            border-radius: 12px;

            color: #707078;

            font-size: 9px;
        }

        .nav-icon {
            font-size: 16px;
        }

        .nav-item.active {
            color: white;

            background:
                rgba(229, 34, 73, .12);
        }

        /* =========================
           TOAST
        ========================= */

        .toast {
            position: fixed;

            left: 50%;
            bottom: 88px;

            transform:
                translate(-50%, 15px);

            padding:
                11px 16px;

            border:
                1px solid var(--border);

            border-radius: 10px;

            background: #15151a;

            color: #e5e5e9;

            font-size: 9px;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .2s ease,
                transform .2s ease;

            z-index: 50;
        }

        .toast.show {
            opacity: 1;

            transform:
                translate(-50%, 0);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .app {
                padding:
                    15px 15px 115px;
            }

            .password-card {
                border-radius: 15px;
            }
        }
    </style>

<!-- AVERYX Change Password Premium UI Enhancement -->
<style>
:root{
    --cp-line:rgba(255,255,255,.09);
    --cp-glow:rgba(229,34,73,.16);
}

body{
    background:
        radial-gradient(circle at 82% -6%,var(--cp-glow),transparent 32%),
        radial-gradient(circle at 7% 92%,rgba(255,255,255,.025),transparent 24%),
        var(--bg);
}

.topbar{
    border-bottom:1px solid var(--cp-line);
}

.brand{transition:transform .18s ease;}
.brand:hover{transform:translateY(-1px);}

.back{
    padding:8px 11px;
    border-radius:9px;
    transition:background .16s ease,transform .16s ease;
}
.back:hover{
    background:rgba(255,255,255,.045);
    transform:translateY(-1px);
}

.header h1{
    letter-spacing:-.6px;
    line-height:1.08;
}

.password-card{
    position:relative;
    overflow:hidden;
    box-shadow:
        0 18px 42px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.03);
}

.password-card::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 100% 0%,rgba(229,34,73,.075),transparent 35%),
        linear-gradient(125deg,rgba(255,255,255,.03),transparent 43%);
}

.field{transition:transform .16s ease;}
.field:focus-within{transform:translateY(-1px);}

.input{
    transition:border-color .18s ease,background .18s ease,box-shadow .18s ease !important;
}

.input:hover{background:#0d0d12;}

.input:focus{
    box-shadow:0 0 0 3px rgba(229,34,73,.10) !important;
}

.toggle-password{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    transition:background .16s ease,color .16s ease;
}

.toggle-password:hover{
    background:rgba(255,255,255,.05);
}

.save-button{
    transition:transform .16s ease,background .16s ease,box-shadow .16s ease,filter .16s ease !important;
}

.save-button:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
    box-shadow:0 10px 24px rgba(0,0,0,.22);
}

.save-button:active{transform:scale(.985);}

.security-note{
    box-shadow:0 12px 28px rgba(0,0,0,.12);
    background:
        linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),
        var(--panel);
}

.bottom-nav{
    border-color:var(--cp-line);
    box-shadow:0 -10px 28px rgba(0,0,0,.22);
}

.nav-item{
    transition:background .16s ease,transform .16s ease;
}

.nav-item:hover{
    background:rgba(255,255,255,.045);
    transform:translateY(-1px);
}

.toast{
    box-shadow:0 12px 28px rgba(0,0,0,.3);
}

@media(max-width:500px){
    .header{padding-top:26px;}
    .password-card{padding:17px;}
}
</style>

</head>

<body>

<main class="app">

    <!-- =========================
         TOP BAR
    ========================= -->

    <header class="topbar">

        <a
            href="profile.html"
            class="brand"
        >

            <img
                src="logo.png"
                alt="AVERYX Logo"
            >

            <span class="brand-name">
                AVERYX
            </span>

        </a>

        <a
            href="profile.html"
            class="back"
        >
            ← Profile
        </a>

    </header>


    <!-- =========================
         HEADER
    ========================= -->

    <section class="header">

        <div class="eyebrow">
            Security
        </div>

        <h1>
            Change Password
        </h1>

        <p>
            Update your account password using
            your current password.
        </p>

    </section>


    <!-- =========================
         PASSWORD FORM
    ========================= -->

    <section class="password-card">

        <!-- OLD PASSWORD -->

        <div class="field">

            <label
                class="field-label"
                for="oldPassword"
            >
                Current / Old Password
            </label>

            <div class="input-wrap">

                <input
                    class="input"
                    id="oldPassword"
                    type="password"
                    placeholder="Enter your current password"
                    autocomplete="current-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="oldPassword"
                >
                    ◉
                </button>

            </div>

        </div>


        <!-- NEW PASSWORD -->

        <div class="field">

            <label
                class="field-label"
                for="newPassword"
            >
                New Password
            </label>

            <div class="input-wrap">

                <input
                    class="input"
                    id="newPassword"
                    type="password"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="newPassword"
                >
                    ◉
                </button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="field">

            <label
                class="field-label"
                for="confirmPassword"
            >
                Confirm New Password
            </label>

            <div class="input-wrap">

                <input
                    class="input"
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="confirmPassword"
                >
                    ◉
                </button>

            </div>

        </div>


        <!-- FORGOT PASSWORD -->

        <div class="forgot-row">

            <a
                href="forgot-password.html"
                class="forgot-link"
            >
                Forgot Password?
            </a>

        </div>


        <!-- SAVE -->

        <button
            type="button"
            class="save-button"
            id="saveButton"
        >
            Save Changes
        </button>

    </section>


    <!-- =========================
         SECURITY NOTE
    ========================= -->

    <div class="security-note">

        Forgot your current password?
        Use <strong>Forgot Password?</strong>
        above to recover your account instead of
        entering an old password.

    </div>

</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

    <a
        href="dashboard.html"
        class="nav-item"
    >
        <span class="nav-icon">⌂</span>
        Home
    </a>


    <a
        href="subscription.html"
        class="nav-item"
    >
        <span class="nav-icon">◇</span>
        Tiers
    </a>


    <a
        href="wallet.html"
        class="nav-item"
    >
        <span class="nav-icon">◈</span>
        Wallet
    </a>


    <a
        href="records.html"
        class="nav-item"
    >
        <span class="nav-icon">≡</span>
        Records
    </a>


    <a
        href="profile.html"
        class="nav-item active"
    >
        <span class="nav-icon">○</span>
        Profile
    </a>

</nav>


<div
    class="toast"
    id="toast"
></div>


<script>

/* ==================================================
   SHOW / HIDE PASSWORD
================================================== */

const toggleButtons =
    document.querySelectorAll(
        ".toggle-password"
    );


toggleButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                const targetId =
                    this.dataset.target;


                const input =
                    document.getElementById(
                        targetId
                    );


                if (
                    input.type ===
                    "password"
                ) {

                    input.type =
                        "text";

                } else {

                    input.type =
                        "password";

                }

            }
        );

    }
);


/* ==================================================
   TOAST
================================================== */

function showToast(
    message
) {

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function() {

            toast.classList.remove(
                "show"
            );

        },
        1800
    );

}


/* ==================================================
   SAVE PASSWORD
================================================== */

const API_BASE_URL =
    window.AVERYX_API_BASE_URL ||
    "https://averyx.onrender.com";


function getToken() {

    return (
        localStorage.getItem("averyx_token") ||
        localStorage.getItem("token") ||
        ""
    );

}


document.getElementById(
    "saveButton"
).addEventListener(
    "click",
    async function() {

        const button =
            this;

        const oldPassword =
            document.getElementById(
                "oldPassword"
            ).value;

        const newPassword =
            document.getElementById(
                "newPassword"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if (!oldPassword) {
            showToast(
                "Enter your current password"
            );
            return;
        }

        if (!newPassword) {
            showToast(
                "Enter a new password"
            );
            return;
        }

        if (newPassword.length < 6) {
            showToast(
                "Password must be at least 6 characters"
            );
            return;
        }

        if (newPassword !== confirmPassword) {
            showToast(
                "New passwords do not match"
            );
            return;
        }

        if (oldPassword === newPassword) {
            showToast(
                "New password must be different"
            );
            return;
        }

        const token =
            getToken();

        if (!token) {
            showToast(
                "Your session has expired. Please log in again."
            );

            setTimeout(
                () => {
                    window.location.href =
                        "login.html";
                },
                1000
            );

            return;
        }


        button.disabled =
            true;

        button.textContent =
            "Updating...";


        try {

            const response =
                await fetch(
                    `${API_BASE_URL}/api/auth/change-password`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`
                        },

                        body:
                            JSON.stringify({
                                currentPassword:
                                    oldPassword,

                                newPassword:
                                    newPassword,

                                confirmPassword:
                                    confirmPassword
                            })
                    }
                );


            const data =
                await response
                    .json()
                    .catch(
                        () => ({})
                    );


            if (!response.ok) {
                throw new Error(
                    data.message ||
                    "Unable to change your password."
                );
            }


            showToast(
                data.message ||
                "Password changed successfully."
            );


            document.getElementById(
                "oldPassword"
            ).value = "";

            document.getElementById(
                "newPassword"
            ).value = "";

            document.getElementById(
                "confirmPassword"
            ).value = "";


        } catch (error) {

            console.error(
                "Change password error:",
                error
            );

            showToast(
                error.message ||
                "Unable to connect to the server."
            );

        } finally {

            button.disabled =
                false;

            button.textContent =
                "Save Changes";

        }

    }
);

</script>


<script src="auth-guard.js"></script>
</body>
</html>
