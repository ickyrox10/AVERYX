<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVERYX | Admin Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070709;--panel:#101014;--border:#292930;--text:#f5f5f7;--muted:#898992;--red:#e52249;--green:#42c998}
body{min-height:100vh;background:radial-gradient(circle at 82% 0%,rgba(126,20,52,.18),transparent 31%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.page{width:100%;max-width:520px;margin:auto;padding:22px 18px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:34px}
.brand img{width:48px;height:48px;object-fit:contain}
.brand-name{font-family:Georgia,serif;font-size:25px;letter-spacing:4px}
.card{padding:28px 24px;border:1px solid var(--border);border-radius:22px;background:radial-gradient(circle at 100% 0%,rgba(229,34,73,.11),transparent 45%),var(--panel)}
.eyebrow{color:var(--muted);font-size:10px;letter-spacing:2.3px;text-transform:uppercase}
h1{margin-top:8px;font-family:Georgia,serif;font-size:34px}
.desc{margin-top:9px;color:var(--muted);font-size:12px;line-height:1.6}
.field{margin-top:20px}
label{display:block;margin-bottom:8px;color:var(--muted);font-size:9px;letter-spacing:1.3px;text-transform:uppercase}
input{width:100%;height:51px;padding:0 14px;border:1px solid var(--border);border-radius:11px;background:#0b0b0f;color:var(--text);outline:none;font:inherit;font-size:13px}
input:focus{border-color:rgba(229,34,73,.7)}
button{width:100%;height:52px;margin-top:22px;border:1px solid rgba(229,34,73,.55);border-radius:11px;background:rgba(229,34,73,.13);color:#f06a85;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
button:hover{background:rgba(229,34,73,.2)}
button:disabled{opacity:.55;cursor:not-allowed}
.message{min-height:19px;margin-top:14px;text-align:center;font-size:10px;line-height:1.5;color:var(--muted)}
.message.error{color:#ff6682}.message.success{color:var(--green)}
.footer{text-align:center;margin-top:20px;color:#5f5f67;font-size:9px}
</style>
</head>
<body>
<main class="page">
  <div class="brand">
    <img src="logo.png" alt="AVERYX Logo">
    <span class="brand-name">AVERYX</span>
  </div>

  <section class="card">
    <div class="eyebrow">Restricted Access</div>
    <h1>Admin Login</h1>
    <p class="desc">Sign in to manage withdrawals and manually confirm transaction processing.</p>

    <form id="adminLoginForm">
      <div class="field">
        <label for="username">Admin Username</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginButton" type="submit">LOGIN TO ADMIN PANEL</button>
      <div id="message" class="message"></div>
    </form>
  </section>

  <div class="footer">AVERYX Administration</div>
</main>

<script>
const API_BASE_URL =
    window.AVERYX_API_BASE_URL ||
    "https://averyx.onrender.com";

const form = document.getElementById("adminLoginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

// Admin authentication is intentionally non-persistent.
// Visiting the admin login page always starts with a fresh login.
if (localStorage.getItem("averyx_admin_token")) {
  window.location.replace("admin.html");
}

function showMessage(text, type = "") {
  message.textContent = text || "";
  message.className = "message" + (type ? " " + type : "");
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  showMessage("");
  loginButton.disabled = true;
  loginButton.textContent = "SIGNING IN...";

  try {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const response = await fetch(`${API_BASE_URL}/api/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    let data = {};
    try { data = await response.json(); } catch (_) {}

    if (!response.ok || data.success === false || !data.token) {
      throw new Error(data.message || "Unable to log in.");
    }

    localStorage.setItem("averyx_admin_token", data.token);
    window.location.replace("admin.html");
  } catch (error) {
    showMessage(error.message || "Unable to complete admin login.", "error");
  } finally {
    loginButton.disabled = false;
    loginButton.textContent = "LOGIN TO ADMIN PANEL";
  }
});
</script>
</body>
</html>
